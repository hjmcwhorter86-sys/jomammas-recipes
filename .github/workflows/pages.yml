name: Deploy to GitHub Pages

# Single workflow for both PR previews and production.
#
# GitHub Pages source must be set to "GitHub Actions" (Settings > Pages >
# Build and deployment > Source) for this to work — NOT "Deploy from a
# branch". With "Deploy from a branch", GitHub auto-triggers its own
# deployment on every push to that branch and cancels older queued ones in
# favor of newer ones with no way for us to opt out — which meant a burst
# of PR preview churn could (and did) starve/cancel the production
# deployment indefinitely. Actions-based deployment lets this workflow own
# the concurrency group below (`cancel-in-progress: false`), so every
# deploy — preview or prod — queues in order instead of getting raced out.
#
# The `gh-pages` branch is kept, but only as durable storage for the
# accumulated site tree (root + each PR's pr-preview/pr-<number>/
# subfolder) between runs — it is no longer the thing Pages actually
# serves. Each run rebuilds that tree, pushes it to `gh-pages` for the
# next run to build on, then publishes it via actions/deploy-pages.
#
# Note: PRs from forks run with a read-only GITHUB_TOKEN, so the push step
# will fail for fork PRs. That matches this repo's normal contribution flow
# (branches pushed directly to this repo), not fork PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  publish-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      comment_id: ${{ steps.comment.outputs.comment_id }}
    steps:
      - name: Post "building" status comment
        id: comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MARKER="<!-- gh-pages-preview-comment -->"
          RUN_URL="https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(printf '%s\n# 🏗️ Preview building... 🚧\n\n[View build log](%s)' "$MARKER" "$RUN_URL")

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
          else
            COMMENT_ID=$(gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY" --jq '.id')
          fi

          echo "comment_id=${COMMENT_ID}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Merge preview into gh-pages tree
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKTREE_DIR: ${{ runner.temp }}/gh-pages
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin gh-pages; then
            git worktree add -B gh-pages "$WORKTREE_DIR" origin/gh-pages
          else
            git worktree add --detach "$WORKTREE_DIR"
            git -C "$WORKTREE_DIR" checkout --orphan gh-pages
            git -C "$WORKTREE_DIR" rm -rf . > /dev/null
          fi

          DEST_DIR="$WORKTREE_DIR/pr-preview/pr-$PR_NUMBER"
          rm -rf "$DEST_DIR"
          mkdir -p "$DEST_DIR"

          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'scripts' \
            --exclude 'playwright-report' \
            --exclude 'test-results' \
            --exclude 'pr-preview' \
            --exclude '*.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'playwright.config.js' \
            --exclude 'serve.json' \
            "$GITHUB_WORKSPACE"/ "$DEST_DIR"/

          touch "$WORKTREE_DIR/.nojekyll"

          cd "$WORKTREE_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "No preview changes for PR #$PR_NUMBER"
          else
            git commit -m "Preview deploy for PR #$PR_NUMBER (${GITHUB_SHA:0:7})"
            git push origin gh-pages
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/gh-pages

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove preview from gh-pages tree
        id: remove
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKTREE_DIR: ${{ runner.temp }}/gh-pages
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if ! git fetch origin gh-pages; then
            echo "gh-pages branch does not exist yet, nothing to clean up"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git worktree add -B gh-pages "$WORKTREE_DIR" origin/gh-pages
          rm -rf "$WORKTREE_DIR/pr-preview/pr-$PR_NUMBER"

          cd "$WORKTREE_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to remove for PR #$PR_NUMBER"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Remove preview for closed PR #$PR_NUMBER"
            git push origin gh-pages
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: steps.remove.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/gh-pages

      - name: Update comment to note preview removed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MARKER="<!-- gh-pages-preview-comment -->"
          BODY=$(printf '%s\n# 🔍 Preview removed\n\nThis PR is closed — the GitHub Pages preview has been cleaned up.' "$MARKER")

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
          fi

  publish-root:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Merge production content into gh-pages tree
        env:
          WORKTREE_DIR: ${{ runner.temp }}/gh-pages
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin gh-pages; then
            git worktree add -B gh-pages "$WORKTREE_DIR" origin/gh-pages
          else
            git worktree add --detach "$WORKTREE_DIR"
            git -C "$WORKTREE_DIR" checkout --orphan gh-pages
            git -C "$WORKTREE_DIR" rm -rf . > /dev/null
          fi

          # Clear the root, but leave each PR's pr-preview/ subfolder alone.
          find "$WORKTREE_DIR" -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name 'pr-preview' -exec rm -rf {} +

          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'scripts' \
            --exclude 'playwright-report' \
            --exclude 'test-results' \
            --exclude 'pr-preview' \
            --exclude '*.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'playwright.config.js' \
            --exclude 'serve.json' \
            "$GITHUB_WORKSPACE"/ "$WORKTREE_DIR"/

          touch "$WORKTREE_DIR/.nojekyll"

          cd "$WORKTREE_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "No root changes to deploy"
          else
            git commit -m "Deploy site to gh-pages root (${GITHUB_SHA:0:7})"
            git push origin gh-pages
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/gh-pages

  deploy:
    needs: [publish-preview, cleanup-preview, publish-root]
    # A PR merge fires both `pull_request: closed` (cleanup-preview) and
    # `push` (publish-root) for the same commit, each in its own workflow
    # run. Both would otherwise call actions/deploy-pages for that same
    # commit, and the second one reliably fails ("Deployment failed, try
    # again later") since GitHub Pages doesn't like two deployments for an
    # identical build version in quick succession. So skip this job on the
    # cleanup-preview path when the PR was actually merged — the push
    # event's publish-root deploy already covers that commit (including
    # this run's preview-removal commit, once queued behind it via the
    # `pages` concurrency group). Only deploy from cleanup-preview alone
    # when the PR was closed without merging, since then no push event
    # will pick up the removal.
    if: |
      always() &&
      (needs.publish-preview.result == 'success' ||
       needs.publish-root.result == 'success' ||
       (needs.cleanup-preview.result == 'success' && github.event.pull_request.merged != true))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  update-preview-comment:
    needs: [publish-preview, deploy]
    if: always() && needs.publish-preview.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Update comment with deploy result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ needs.publish-preview.outputs.comment_id }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail

          MARKER="<!-- gh-pages-preview-comment -->"
          RUN_URL="https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"
          PREVIEW_URL="https://${OWNER}.github.io/${NAME}/pr-preview/pr-${PR_NUMBER}/"

          if [ "$DEPLOY_RESULT" = "success" ]; then
            BODY=$(printf '%s\n# 🚀 Preview deployed! 🥳\n\n**[View preview](%s)**\n\nUpdated for commit `%s` · [Build log](%s)' \
              "$MARKER" "$PREVIEW_URL" "${GITHUB_SHA:0:7}" "$RUN_URL")
          else
            BODY=$(printf '%s\n# ❌ Preview build/deploy failed! 😵\n\n[View build log](%s)' \
              "$MARKER" "$RUN_URL")
          fi

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
          else
            COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
            else
              gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" > /dev/null
            fi
          fi
